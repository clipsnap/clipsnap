<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ClipSnap</title>
    <meta name="description" content="Get in touch with the ClipSnap team for support, feedback, or business inquiries.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">
            <i class="fa-solid fa-cloud-arrow-down"></i>
            <span>ClipSnap</span>
        </a>
        <nav class="nav-links">
            <a href="/facebook"><i class="fa-brands fa-facebook"></i> Facebook</a>
            <a href="/instagram"><i class="fa-brands fa-instagram"></i> Instagram</a>
            <a href="/twitter"><i class="fa-brands fa-x-twitter"></i> X (Twitter)</a>
            <a href="/contact" class="active"><i class="fa-solid fa-envelope"></i> Contact</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="tool-badge">
            <i class="fa-solid fa-envelope"></i> Support & Inquiry
        </div>
        
        <h1 class="tool-title">Contact Us</h1>
        <p class="tool-subtitle">Have questions, feedback, or technical issues? Send us a direct message below.</p>

        <div class="downloader-card contact-card">
            <form id="ajaxContactForm">
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="contactName" name="name" placeholder="Your Name" required>
                </div>
                
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="contactEmail" name="email" placeholder="Your Email Address" required>
                </div>
                
                <div class="input-wrapper">
                    <textarea class="contact-textarea" id="contactMessage" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                
                <button type="submit" id="sendBtn" class="download-btn">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </button>
            </form>

            <div id="contactStatus" style="display: none; margin-top: 1.5rem; padding: 1rem; border-radius: 0.75rem; text-align: center; font-weight: 500;"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="/facebook">Facebook Downloader</a>
            <a href="/instagram">Instagram Downloader</a>
            <a href="/twitter">Twitter Downloader</a>
            <a href="/contact">Contact Us</a>
        </div>
        <p class="footer-copy">&copy; 2026 ClipSnap. All rights reserved.</p>
    </footer>

    <script>
    document.getElementById('ajaxContactForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const sendBtn = document.getElementById('sendBtn');
        const statusBox = document.getElementById('contactStatus');
        const name = document.getElementById('contactName').value.trim();
        const email = document.getElementById('contactEmail').value.trim();
        const message = document.getElementById('contactMessage').value.trim();

        sendBtn.disabled = true;
        sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';
        statusBox.style.display = 'none';

        try {
            const res = await fetch("https://formsubmit.co/ajax/tarikgeopark@gmail.com", {
                method: "POST",
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    message: message,
                    _subject: "New Message from ClipSnap!"
                })
            });

            if (res.ok) {
                statusBox.style.display = 'block';
                statusBox.style.background = 'rgba(16, 185, 129, 0.15)';
                statusBox.style.border = '1px solid #10b981';
                statusBox.style.color = '#34d399';
                statusBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> Your message has been sent successfully!';
                document.getElementById('ajaxContactForm').reset();
            } else {
                throw new Error();
            }
        } catch (err) {
            statusBox.style.display = 'block';
            statusBox.style.background = 'rgba(239, 68, 68, 0.15)';
            statusBox.style.border = '1px solid #ef4444';
            statusBox.style.color = '#f87171';
            statusBox.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Failed to send. Please try again.';
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Message';
        }
    });
    </script>
</body>
</html>
