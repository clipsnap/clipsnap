<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ClipSnap</title>
    <meta name="description" content="Get in touch with the ClipSnap team for support, feedback, or business inquiries.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo">
            <i class="fa-solid fa-cloud-arrow-down"></i>
            <span>ClipSnap</span>
        </a>
        <nav class="nav-links">
            <a href="/facebook"><i class="fa-brands fa-facebook"></i> Facebook</a>
            <a href="/instagram"><i class="fa-brands fa-instagram"></i> Instagram</a>
            <a href="/twitter"><i class="fa-brands fa-x-twitter"></i> X (Twitter)</a>
            <a href="/contact" class="active"><i class="fa-solid fa-envelope"></i> Contact</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="tool-badge">
            <i class="fa-solid fa-envelope"></i> Support & Inquiry
        </div>
        
        <h1 class="tool-title">Contact Us</h1>
        <p class="tool-subtitle">Have questions, feedback, or technical issues? Send us a direct message below.</p>

        <div class="downloader-card contact-card">
            <form action="https://formsubmit.co/tarikgeopark@gmail.com" method="POST" id="contactForm">
                <input type="hidden" name="_subject" value="New Message from ClipSnap!">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" name="name" placeholder="Your Name" required autocomplete="name">
                </div>
                
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" name="email" placeholder="Your Email Address" required autocomplete="email">
                </div>
                
                <div class="input-wrapper">
                    <textarea class="contact-textarea" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                
                <button type="submit" class="download-btn">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="/facebook">Facebook Downloader</a>
            <a href="/instagram">Instagram Downloader</a>
            <a href="/twitter">Twitter Downloader</a>
            <a href="/contact">Contact Us</a>
        </div>
        <p class="footer-copy">&copy; 2026 ClipSnap. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
